<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>সেবাটি বন্ধ রয়েছে</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f1f5f9;
      color: #1e293b;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      padding: 35px 25px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    .icon {
      width: 56px;
      height: 56px;
      background-color: #fee2e2;
      color: #ef4444;
      border-radius: 50%;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      font-size: 28px;
      margin-bottom: 16px;
    }
    h2 {
      color: #dc2626;
      font-size: 20px;
      margin-bottom: 10px;
    }
    p {
      font-size: 14px;
      color: #64748b;
      line-height: 1.6;
      margin-bottom: 20px;
    }
    .status-badge {
      display: inline-block;
      padding: 8px 16px;
      background-color: #f0fdf4;
      color: #16a34a;
      border: 1px solid #bbf7d0;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="icon">⚠️</div>
    <h2>অ্যাপ্লিকেশনটি বন্ধ করা হয়েছে</h2>
    <p>এই ক্যালকুলেটরটির কার্যক্রম স্থায়ীভাবে প্রত্যাহার করা হয়েছে। আপনার ফোন থেকে অ্যাপ্লিকেশনটি আনইন্সটল (Uninstall) করে দিন।</p>
    <div id="status" class="status-badge">ক্যাশ পরিষ্কার করা হচ্ছে...</div>
  </div>

  <script>
    async function purgeAllData() {
      try {
        // ১. সব সার্ভিস ওয়ার্কার আনরেজিস্টার করা
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          for (let registration of registrations) {
            await registration.unregister();
          }
        }

        // ২. সব ক্যাশ স্টোরেজ ডিলিট করা
        if ('caches' in window) {
          const cacheKeys = await caches.keys();
          for (let key of cacheKeys) {
            await caches.delete(key);
          }
        }

        // ৩. লোকাল ও সেশন স্টোরেজ ক্লিয়ার করা
        localStorage.clear();
        sessionStorage.clear();

        // ৪. IndexedDB পরিষ্কার করা
        if (window.indexedDB && indexedDB.databases) {
          const dbs = await indexedDB.databases();
          for (let db of dbs) {
            if (db.name) {
              indexedDB.deleteDatabase(db.name);
            }
          }
        }

        // ৫. কুকিজ ক্লিয়ার করা
        document.cookie.split(";").forEach((c) => {
          document.cookie = c.replace(/^ +/, "").replace(/=.*/, "=;expires=" + new Date().toUTCString() + ";path=/");
        });

        document.getElementById('status').innerText = '✓ পুরোনো ক্যাশ সফলভাবে মুছে ফেলা হয়েছে';
      } catch (err) {
        console.error('ক্লিনআপ ত্রুটি:', err);
        document.getElementById('status').innerText = '✓ ডেটা রিসেট সম্পন্ন হয়েছে';
      }
    }

    // পেজ লোড হওয়ার সাথে সাথে ক্লিনআপ রান করা
    window.addEventListener('load', purgeAllData);
  </script>
</body>
</html>
