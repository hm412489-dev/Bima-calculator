<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>সেবাটি বন্ধ রয়েছে</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f8fafc;
      color: #334155;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: white;
      padding: 30px 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      max-width: 420px;
      width: 100%;
    }
    h2 {
      color: #ef4444;
      margin-top: 0;
      font-size: 20px;
    }
    p {
      font-size: 15px;
      line-height: 1.6;
      margin: 12px 0;
    }
    .status {
      font-size: 13px;
      color: #10b981;
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>এই অ্যাপ্লিকেশনটির কার্যক্রম বন্ধ করা হয়েছে</h2>
    <p>সফটওয়্যারটি সার্ভার থেকে সরিয়ে নেওয়া হয়েছে। অনুগ্রহ করে আপনার হোমস্ক্রিন থেকে এটি আনইন্সটল (Uninstall) করে নিন।</p>
    <div id="status" class="status">পুরোনো ডেটা পরিষ্কার করা হচ্ছে...</div>
  </div>

  <script>
    async function cleanUpApp() {
      try {
        // ১. সব সার্ভিস ওয়ার্কার আনরেজিস্টার করা
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          for (let registration of registrations) {
            await registration.unregister();
          }
        }

        // ২. ক্যাশ স্টোরেজ পরিষ্কার করা
        if ('caches' in window) {
          const keys = await caches.keys();
          for (let key of keys) {
            await caches.delete(key);
          }
        }

        // ৩. লোকাল ও সেশন স্টোরেজ ক্লিয়ার করা
        localStorage.clear();
        sessionStorage.clear();

        // ৪. IndexedDB ডেটাবেজ ডিলিট করা (যদি থাকে)
        if (window.indexedDB && indexedDB.databases) {
          const dbs = await indexedDB.databases();
          for (let db of dbs) {
            if (db.name) {
              indexedDB.deleteDatabase(db.name);
            }
          }
        }

        document.getElementById('status').innerText = '✓ সফলভাবে পুরোনো ক্যাশ ও ডেটা মুছে ফেলা হয়েছে।';
      } catch (err) {
        console.error('ক্লিনআপে সমস্যা:', err);
      }
    }

    // পেজ লোড হওয়া মাত্রই ক্লিনআপ শুরু হবে
    window.addEventListener('load', cleanUpApp);
  </script>
</body>
</html>
